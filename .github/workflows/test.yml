name: test

on:
  push:
  pull_request:

jobs:
  test:
    # macOS: the app and its native pty module are macOS-only, and the shell
    # helpers under test run zsh
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # tests run in plain Node; the Electron binary is only needed to package
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
